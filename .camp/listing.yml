name: tool_gradesort
summary: A Moodle admin tool that sorts the contents of a course's grade category.
description: |
  Moodle's gradebook appends every new grade item to the end, so gradebook
  order drifts away from course order as soon as a course is edited. Core has
  an `autosort` stub that was never implemented — this tool implements it:
  pick a grade category and a sort mode (such as the order activities appear
  on the course page) and the category's contents are reordered in one
  action.
